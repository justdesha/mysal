<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>Bud</title>
  <meta name="description" content="Bud — графік змін, гроші й баланс між роботою та життям">
  <meta name="theme-color" content="#F1EEF8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bud">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="icon" type="image/png" href="./icons/favicon.png">
  <link rel="preload" href="./fonts/dela-gothic-one-cyrillic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./fonts/rubik-cyrillic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // paint the right theme before anything renders
    try {
      var t = ((JSON.parse(localStorage.getItem('mysal7') || '{}').cfg) || {}).theme || 'auto';
      if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div id="app"></div>
  <div id="sheets"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
